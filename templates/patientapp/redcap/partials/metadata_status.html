{% load i18n %}
<div id="metadata-status-{{ mapping.pk }}">
{% if error %}
  <span class="inline-flex items-center px-2 py-1 rounded text-xs bg-red-50 text-red-700 border border-red-200" title="{{ error }}">
    ✗ {% trans "Fetch failed" %} — {{ error|truncatechars:60 }}
  </span>
{% else %}
  <span class="inline-flex items-center px-2 py-1 rounded text-xs bg-green-50 text-green-700 border border-green-200">
    ✓ {% trans "Metadata loaded" %} — {{ mapping.redcap_record_count }} {% trans "records" %}
  </span>
{% endif %}
</div>
